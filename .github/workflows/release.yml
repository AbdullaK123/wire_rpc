name: Release

# Publishing a GitHub Release uploads that version to PyPI.
# Running this workflow by hand ("Run workflow") uploads to TestPyPI by default, as a
# practice run, or to PyPI when "pypi" is chosen and the run is on a version tag (vX.Y.Z)
# matching pyproject.toml. All uploads use PyPI trusted publishing: no API token is stored here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload. "pypi" requires running on a version tag.
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.18
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Release tag matches the package version
        if: github.event_name == 'release' || inputs.target == 'pypi'
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.event_name == 'release' && 'tag' || github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Publishing to PyPI by hand must run on a version tag, not the branch $TAG" >&2
            exit 1
          fi
          version="$(uv version --short)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match version $version in pyproject.toml" >&2
            exit 1
          fi
      - name: Pyrefly type checking
        run: uv run --locked pyrefly check
      - name: Ruff lint
        run: uv run --locked ruff check
      - name: Full suite, including Testcontainers PostgreSQL and Redis
        run: uv run --locked pytest -q -W error

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.18
      - name: Install locked dependencies
        run: uv sync --locked
      # TestPyPI never accepts the same file name twice, so each practice run gets its
      # own pre-release version, e.g. 0.3.0.dev1201 for run 12, attempt 1.
      - name: Give a TestPyPI practice build a unique dev version
        if: github.event_name == 'workflow_dispatch' && inputs.target != 'pypi'
        run: uv version --frozen "$(uv version --short).dev$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
      - name: Build sdist and wheel
        run: uv build --no-sources
      # Restore the committed version so uv.lock still matches for the locked checks below.
      - name: Restore pyproject.toml
        run: git checkout -- pyproject.toml
      - name: Verify installed wheel outside source checkout
        run: uv run --locked python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'pypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wire-rpc
    permissions:
      id-token: write  # lets PyPI verify this workflow; no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        run: python -m pip install uv==0.12.18
      - name: Upload
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' || inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/wire-rpc
    permissions:
      id-token: write  # lets PyPI verify this workflow; no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        run: python -m pip install uv==0.12.18
      - name: Upload
        run: uv publish --trusted-publishing always dist/*
