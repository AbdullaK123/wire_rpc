name: Adversarial tests
on:
  push:
    branches: [main, fix/production-contracts]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.18
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Mypy (including unannotated function bodies)
        run: uv run --locked mypy
      - name: Pyright (Pylance type checking)
        run: uv run --locked pyright
      - name: Adversarial suite
        run: uv run --locked pytest -q -W error
      - name: Build distribution
        run: uv build --no-sources
      - name: Verify installed wheel outside source checkout
        run: uv run --locked python scripts/check_wheel.py
