name: Adversarial tests
on:
  push:
    branches: [main, fix/production-contracts, feature/auth-suite]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      # Without this, every `uv run` follows .python-version (3.12) and rebuilds the venv with it.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv==0.12.18
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check the matrix Python is the one under test
        run: uv run --locked python -c "import sys; v = '%d.%d' % sys.version_info[:2]; assert v == '${{ matrix.python }}', v; print('Python', sys.version)"
      - name: Pyrefly type checking
        run: uv run --locked pyrefly check
      - name: Ruff lint (pyflakes and import order)
        run: uv run --locked ruff check
      - name: Adversarial suite
        run: uv run --locked pytest -q -W error -m "not integration"
      - name: Build distribution
        run: uv build --no-sources
      - name: Verify installed wheel outside source checkout
        run: uv run --locked python scripts/check_wheel.py

  shared-session-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --locked
      - name: Full suite with Testcontainers PostgreSQL and Redis
        run: uv run --locked pytest -q -W error
