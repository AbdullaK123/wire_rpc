[project]
name = "wire-rpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "loguru>=0.7.3",
    "msgspec>=0.21.1",
    "pydantic>=2.13.4",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
password = ["argon2-cffi>=25.1.0"]
jwt = ["PyJWT[crypto]>=2.10.1"]
redis = ["redis>=5.2.0"]
postgres = ["asyncpg>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-requires = "hatchling"
build-backend = "hatchling.build"

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
check_untyped_defs = true
files = ["wire_rpc", "tests", "scripts"]
python_version = "3.12"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "msgspec.*",
    "loguru.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "PyJWT[crypto]>=2.10.1",
    "redis>=5.2.0",
    "mypy==2.3.1",
    "pyright==1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10

[tool.pyright]
include = ["wire_rpc", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
