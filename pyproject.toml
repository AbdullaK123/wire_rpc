[project]
name = "wire-rpc"
version = "0.3.0"
description = "Typed asyncio JSON-RPC 2.0 with pluggable transports, codecs and authentication"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdalla Kayyani" }]
keywords = ["json-rpc", "rpc", "asyncio", "websocket", "msgspec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.3",
    "msgspec>=0.21.1",
    "pydantic>=2.13.4",
    "typing-extensions>=4.16.0",
]

[project.urls]
Repository = "https://github.com/AbdullaK123/wire_rpc"
Documentation = "https://github.com/AbdullaK123/wire_rpc/blob/main/docs/README.md"
Changelog = "https://github.com/AbdullaK123/wire_rpc/blob/main/CHANGELOG.md"
Issues = "https://github.com/AbdullaK123/wire_rpc/issues"

[project.optional-dependencies]
password = ["argon2-cffi>=25.1.0"]
jwt = ["PyJWT[crypto]>=2.10.1"]
redis = ["redis>=5.2.0"]
postgres = ["asyncpg>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-requires = "hatchling"
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "PyJWT[crypto]>=2.10.1",
    "redis>=5.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "testcontainers[postgres,redis]==4.15.0",
    "pyrefly==1.4.0",
    "ruff==0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 10
markers = ["integration: requires Docker; starts isolated PostgreSQL/Redis containers"]

[tool.ruff]
src = ["wire_rpc", "tests", "scripts"]
target-version = "py312"

[tool.ruff.lint]
# Pyflakes (unused imports and variables, undefined names) and import sorting.
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["wire_rpc", "tests"]

[tool.pyrefly]
project-includes = ["wire_rpc", "tests", "scripts"]
python-version = "3.12"
